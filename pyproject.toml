[project]
name = "smartdevtool"
version = "0.1.0"
description = "CLI + Python library that automates API integration and environment reproducibility"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pydantic>=2.9.2",
  "jinja2>=3.1.4",
  "httpx>=0.27.2",
  "python-dotenv>=1.0.1",
  "openai>=1.0.0",
  "watchdog>=4.0.0",
  "pip-tools>=7.4.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "ruff==0.17.3",
  "build>=1.0.0",
]

[project.scripts]
smartdevtool = "smartdevtool.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Rules enabled: pycodestyle errors, pyflakes, isort, flake8-comprehensions, pyupgrade
select = ["E", "F", "I", "C4", "UP"]
# Ignored rules:
# E501  - line-length already set to 120; remaining long lines are in Typer help strings (unavoidable)
# B008  - typer.Argument/Option in defaults is the standard Typer pattern
# BLE001 - broad Exception catches are intentional in parser/agent code
# S110  - try/except/pass is acceptable in parsers
# PERF102 - dict.items() usage is fine here
# RUF059 - unused unpacked vars in tests are intentional
ignore = ["E501", "B008", "BLE001", "S110", "PERF102", "RUF059"]

[tool.setuptools.packages.find]
where = ["."]
include = ["smartdevtool*"]

[tool.setuptools.package-data]
"smartdevtool.wrapper" = ["templates/*.jinja"]
