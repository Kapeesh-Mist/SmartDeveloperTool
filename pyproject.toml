[project]
name = "smartdevtool"
version = "0.1.0"
description = "CLI + Python library that automates API integration and environment reproducibility"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pydantic>=2.9.2",
  "jinja2>=3.1.4",
  "httpx>=0.27.2",
  "python-dotenv>=1.0.1",
  "openai>=1.0.0",
  "watchdog>=4.0.0",
  "pip-tools>=7.4.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.8",
  "build>=1.0.0",
]

[project.scripts]
smartdevtool = "smartdevtool.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["."]
include = ["smartdevtool*"]

[tool.setuptools.package-data]
"smartdevtool.wrapper" = ["templates/*.jinja"]
